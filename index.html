<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bölüm — HubLand</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#070a12;color:#f6f8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:650px;margin:auto;padding:16px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}h1{margin:0;font-size:25px}.sub{color:#96a2b9;font-size:12px}.card{background:#111827;border:1px solid #27344d;border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 16px 45px #0005}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;color:#aab5c9;margin-bottom:6px}input,select{width:100%;background:#0a101d;color:#fff;border:1px solid #2b3954;border-radius:12px;padding:11px;outline:none}button{border:0;border-radius:12px;padding:11px 14px;background:#202d47;color:#fff;font-weight:900}button.primary{background:linear-gradient(135deg,#6754ff,#4c8cff)}button.danger{background:#3a1720;color:#ffb1bd}.hidden{display:none!important}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#18243a;border:1px solid #293753;padding:7px 10px;border-radius:999px;font-size:12px}.list{display:grid;gap:8px}.table{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0c1321;border:1px solid #25324a;border-radius:15px;padding:12px}.table small{display:block;color:#9aa7bd;margin-top:4px}.table b{display:block}.join{white-space:nowrap}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{padding:14px;background:#0b1220;border:1px solid #26334c;border-radius:15px}.player.me{border-color:#6d5cff}.player strong{display:block}.player span{color:#99a5bb;font-size:12px}.big{font-size:44px;font-weight:1000;text-align:center;margin:14px 0}.dice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.die{background:#0a101c;border:1px solid #2b3852;border-radius:18px;text-align:center;padding:16px}.die b{font-size:40px}.calc{font-size:18px;text-align:center;margin:14px 0}.notice{text-align:center;color:#aeb9cc;min-height:24px}.actions{display:grid;gap:8px}.history{max-height:220px;overflow:auto;display:grid;gap:6px}.history div{padding:8px 10px;background:#0b1220;border-radius:10px;color:#aab5c9;font-size:12px}@media(max-width:420px){.players{grid-template-columns:1fr}.row{display:grid;grid-template-columns:1fr 1fr}.row>*{width:100%}}
</style></head><body><div class="app">
<div class="top"><div><h1>🎲 Bölüm</h1><div class="sub">Şansın hesabı vardır.</div></div><button id="backBtn">HubLand</button></div>
<section id="home"><div class="card"><h2>Yeni Masa</h2>
<div class="field"><label>Zarın en düşük değeri</label><input id="minDie" type="number" min="1" max="30" value="1"></div>
<div class="field"><label>Zarın en yüksek değeri</label><input id="maxDie" type="number" min="1" max="30" value="6"></div>
<div class="field"><label>Her tarafın pul sayısı</label><input id="pieceCount" type="number" min="18" max="100" value="18"></div>
<div class="field"><label>Masa türü</label><select id="visibility"><option value="public">Public</option><option value="private">Private</option></select></div>
<div class="field hidden" id="codeField"><label>Masa kodu</label><input id="tableCode" maxlength="24" placeholder="Örn. KAPI-42"></div>
<button id="createBtn" class="primary" style="width:100%">Masa Aç</button></div>
<div class="card"><h2>Public Masalar</h2><div id="tableList" class="list"><div class="sub">Masalar yükleniyor…</div></div></div>
<div class="card"><h2>Kodla Gir</h2><div class="row"><input id="joinCode" placeholder="Masa kodu"><button id="joinCodeBtn" class="primary">Katıl</button></div></div></section>
<section id="room" class="hidden"><div class="card"><div class="pills"><span class="pill" id="roomVisibility"></span><span class="pill" id="roomRules"></span><span class="pill" id="roomStatus"></span></div><h2 id="roomTitle">Masa</h2><div id="players" class="players"></div></div>
<div id="gameCard" class="card hidden"><div class="notice" id="turnNotice"></div><div class="big" id="pieceCounts">18 — 18</div><div class="sub" style="text-align:center">Sol: Sen · Sağ: Rakip</div>
<div class="actions" style="margin-top:14px"><button id="startRollBtn" class="primary">Başlangıç Atımı</button></div>
<div id="roundArea" class="hidden"><div class="dice"><div class="die"><span>Zar 1</span><b id="die1">—</b></div><div class="die"><span>Zar 2</span><b id="die2">—</b></div></div><div class="calc" id="calc">—</div>
<div class="actions"><button id="rollBtn" class="primary">Atım Yap</button><div id="doubleActions" class="row hidden"><button id="fixDouble">Sabitle · 1 Pul</button><button id="upgradeDouble" class="primary">Yükselt · Tekrar At</button></div></div><div class="notice" id="resultNotice"></div></div>
<h3>Hesap Geçmişi</h3><div id="history" class="history"></div></div><div class="card"><button id="leaveBtn" class="danger" style="width:100%">Masadan Ayrıl</button></div></section></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:'AIzaSyCNiUkBWL3Swn0e3PyoWBxjvhM8_wPHRXs',authDomain:'ttoo124.firebaseapp.com',projectId:'ttoo124',storageBucket:'ttoo124.firebasestorage.app',messagingSenderId:'973946201796',appId:'1:973946201796:web:e3574c4d100be99bbbcb91',measurementId:'G-5MT78F9R1D'};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();const $=id=>document.getElementById(id);let me=null,hubUid=null,current=null,unsub=null;
const TABLES='bolumTables';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}function floorDiv(a,b){return Math.floor(Math.max(a,b)/Math.min(a,b))}
function setView(id){$('home').classList.toggle('hidden',id!=='home');$('room').classList.toggle('hidden',id!=='room')}function playerName(){return me?.displayName||me?.email?.split('@')[0]||'Oyuncu'}function showError(e){alert((e&&e.message)||'Bir hata oluştu.')}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='HUBLAND_AUTH_CONTEXT'&&d.uid){hubUid=d.uid;sessionStorage.setItem('hubUid',d.uid)}if(d.type==='HUBLAND_REQUEST_AUTH_CONTEXT')try{parent.postMessage({type:'BOLUM_READY'},'*')}catch(_){}});
async function authInit(){if(auth.currentUser){me=auth.currentUser;return}try{me=(await auth.signInAnonymously()).user}catch(e){showError(e)}}
async function createTable(){const min=Math.max(1,Math.min(30,Number($('minDie').value)||1)),max=Math.max(min,Math.min(30,Number($('maxDie').value)||6)),pieces=Math.max(18,Math.min(100,Number($('pieceCount').value)||18)),visibility=$('visibility').value,code=$('tableCode').value.trim();if(visibility==='private'&&!code)return alert('Private masa için bir kod yaz.');if(visibility==='private'&&code.length<3)return alert('Masa kodu en az 3 karakter olsun.');const ref=db.collection(TABLES).doc(),uid=hubUid||me.uid;await ref.set({ownerUid:uid,createdByAuthUid:me.uid,ownerName:playerName(),minDie:min,maxDie:max,pieces,visibility,code:visibility==='private'?code:null,status:'waiting',players:[{uid,authUid:me.uid,name:playerName(),pieces}],turn:null,round:0,dice:null,lastResult:null,history:[],createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await openTable(ref.id)}
async function openTable(id){if(unsub)unsub();unsub=db.collection(TABLES).doc(id).onSnapshot(s=>{if(!s.exists){alert('Masa artık yok.');return leaveLocal()}current={id:s.id,...s.data()};renderRoom()},showError);setView('room')}
function renderTables(snap){const list=$('tableList');list.innerHTML='';const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.visibility==='public'&&t.status!=='finished').sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));if(!docs.length){list.innerHTML='<div class="sub">Şu anda public masa yok.</div>';return}docs.forEach(t=>{const el=document.createElement('div');el.className='table';el.innerHTML='<div><b>'+esc(t.ownerName)+' masası</b><small>'+t.minDie+'–'+t.maxDie+' zar · '+t.pieces+' pul · '+(t.players?.length||0)+'/2 oyuncu</small></div><button class="join primary">Katıl</button>';el.querySelector('button').onclick=()=>joinTable(t.id);list.appendChild(el)})}
async function joinTable(id){const ref=db.collection(TABLES).doc(id),s=await ref.get();if(!s.exists)return alert('Masa bulunamadı.');const t=s.data(),uid=hubUid||me.uid;if((t.players||[]).some(p=>p.uid===uid))return openTable(id);if((t.players||[]).length>=2)return alert('Bu masa dolu.');await ref.update({players:firebase.firestore.FieldValue.arrayUnion({uid,authUid:me.uid,name:playerName(),pieces:t.pieces}),status:'playing',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});openTable(id)}
async function joinByCode(){const code=$('joinCode').value.trim();if(!code)return;const snap=await db.collection(TABLES).where('code','==',code).limit(5).get();const doc=snap.docs.find(d=>d.data().status!=='finished');if(!doc)return alert('Bu kodla açık bir masa bulunamadı.');await joinTable(doc.id)}
function meIndex(){return(current.players||[]).findIndex(p=>p.uid===(hubUid||me?.uid))}function isMyTurn(){return current.turn===(hubUid||me?.uid)}
function renderRoom(){const ps=current.players||[];$('roomTitle').textContent='Masa · '+current.id.slice(0,7);$('roomVisibility').textContent=current.visibility==='public'?'Public':'Private · '+(current.code||'');$('roomRules').textContent=current.minDie+'–'+current.maxDie+' zar · '+current.pieces+' pul';$('roomStatus').textContent=current.status==='waiting'?'Oyuncu bekleniyor':current.status==='finished'?'Bitti':'Oyun';$('players').innerHTML=ps.map(p=>'<div class="player '+(p.uid===(hubUid||me?.uid)?'me':'')+'"><strong>'+esc(p.name)+'</strong><span>'+p.pieces+' pul</span></div>').join('');$('pieceCounts').textContent=(ps[0]?.pieces??current.pieces)+' — '+(ps[1]?.pieces??current.pieces);$('gameCard').classList.toggle('hidden',ps.length<2||current.status==='finished');$('startRollBtn').classList.toggle('hidden',ps.length<2||current.round>0||current.turn);$('roundArea').classList.toggle('hidden',ps.length<2||!current.turn);$('turnNotice').textContent=ps.length<2?'İkinci oyuncu bekleniyor…':current.turn?('Sıra: '+(ps.find(p=>p.uid===current.turn)?.name||'Oyuncu')):'Başlangıç Atımı gerekiyor.';$('rollBtn').disabled=!isMyTurn();$('doubleActions').classList.toggle('hidden',!current.lastResult?.doublePending||!isMyTurn());if(current.dice){$('die1').textContent=current.dice[0];$('die2').textContent=current.dice[1];$('calc').textContent=current.lastResult?.text||'—'}else{$('die1').textContent='—';$('die2').textContent='—';$('calc').textContent='—'}$('resultNotice').textContent=current.lastResult?.notice||'';$('history').innerHTML=(current.history||[]).slice().reverse().map(x=>'<div>'+esc(x)+'</div>').join('')}
async function startRoll(){if(!current||current.players.length!==2||current.turn)return;let a=rand(current.minDie,current.maxDie),b=rand(current.minDie,current.maxDie);if(a===b){return db.collection(TABLES).doc(current.id).update({dice:[a,b],lastResult:{text:'Eşitlik: '+a+' · '+b,notice:'Başlangıç eşitliği — tekrar atılıyor.'},history:firebase.firestore.FieldValue.arrayUnion('Başlangıç: '+a+' · '+b+' → eşitlik, tekrar'),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}const winner=a>b?current.players[0]:current.players[1];await db.collection(TABLES).doc(current.id).update({dice:[a,b],turn:winner.uid,round:1,lastResult:{text:'Başlangıç: '+a+' · '+b,notice:winner.name+' başlıyor.'},history:firebase.firestore.FieldValue.arrayUnion('Başlangıç: '+a+' · '+b+' → '+winner.name+' başlıyor.'),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}
async function award(amount,a,b,label){const idx=meIndex(),opp=idx===0?1:0;if(idx<0||opp<0)return;const ps=current.players.map(p=>({...p})),actual=Math.min(amount,ps[opp].pieces);ps[opp].pieces-=actual;const winner=ps[opp].pieces<=0;await db.collection(TABLES).doc(current.id).update({players:ps,status:winner?'finished':'playing',turn:winner?null:ps[opp].uid,round:current.round+1,lastResult:{text:a+' · '+b+' → '+actual+' pul',notice:winner?playerName()+' masayı temizledi!':actual+' pul alındı.',doublePending:false},history:firebase.firestore.FieldValue.arrayUnion(playerName()+': '+label+' '+a+' · '+b+' → '+actual+' pul'),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}
async function roll(){if(!isMyTurn())return;const a=rand(current.minDie,current.maxDie),b=rand(current.minDie,current.maxDie);if(a===b)return db.collection(TABLES).doc(current.id).update({dice:[a,b],lastResult:{text:a+' · '+b+' → İkiz',notice:'İkiz! Sabitle veya Yükselt.',doublePending:true},history:firebase.firestore.FieldValue.arrayUnion(playerName()+': '+a+' · '+b+' → İkiz'),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});const amount=floorDiv(a,b);await award(amount,a,b,'Atım')}
async function fixDouble(){if(isMyTurn())await award(1,current.dice[0],current.dice[1],'İkiz · Sabitle')}
async function upgradeDouble(){if(!isMyTurn())return;const a=rand(current.minDie,current.maxDie),b=rand(current.minDie,current.maxDie),amount=Math.max(0,floorDiv(a,b)-1);await award(amount,a,b,'İkiz · Yükselt')}
async function leaveLocal(){if(unsub)unsub();unsub=null;current=null;setView('home')}
async function leaveTable(){if(!current)return;const uid=hubUid||me.uid,ps=(current.players||[]).filter(p=>p.uid!==uid);try{if(!ps.length)await db.collection(TABLES).doc(current.id).delete();else await db.collection(TABLES).doc(current.id).update({players:ps,status:'waiting',turn:null,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){showError(e)}leaveLocal()}
$('visibility').onchange=e=>$('codeField').classList.toggle('hidden',e.target.value!=='private');$('createBtn').onclick=()=>createTable().catch(showError);$('joinCodeBtn').onclick=()=>joinByCode().catch(showError);$('startRollBtn').onclick=()=>startRoll().catch(showError);$('rollBtn').onclick=()=>roll().catch(showError);$('fixDouble').onclick=()=>fixDouble().catch(showError);$('upgradeDouble').onclick=()=>upgradeDouble().catch(showError);$('leaveBtn').onclick=()=>leaveTable().catch(showError);$('backBtn').onclick=()=>{try{parent.postMessage({type:'BOLUM_CLOSE'},'*')}catch(_){location.href='about:blank'}};
authInit().then(()=>{hubUid=sessionStorage.getItem('hubUid')||null;if(!hubUid)try{parent.postMessage({type:'HUBLAND_REQUEST_AUTH_CONTEXT'},'*')}catch(_){}db.collection(TABLES).where('visibility','==','public').where('status','in',['waiting','playing']).limit(30).onSnapshot(renderTables,showError)})
</script></body></html>
